# Render Blueprint: one free web service. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: preflight-paypal
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /api/preflight/state
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: AG_STUDIO
        sync: false
      - key: AG_STUDIO_OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODELS
        value: gpt-5.4-mini
      - key: PREFLIGHT_COOLING_MINUTES
        value: "2"
      - key: AI_RATE_PER_MINUTE
        value: "20"
